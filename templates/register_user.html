<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register User</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
<div class="wrapper">
    <form method="POST">
        <h2><i>Create an account</i></h2>
        <div class="input-box">
            <input type="text" name="name" placeholder="Full Name" required>
        </div>
        <div class="input-box">
            <!-- Username (important) -->
            <input type="text" name="username" placeholder="Username" required>
            <i class='bx bxs-user'></i>
        </div>
        <div class="input-box">
            <!-- Password -->
            <input type="password" name="password" placeholder="Password" required>
            <i class='bx bxs-lock-alt' ></i>
        </div>
    
        <!-- Role -->
        <div class="input-box custom-dropdown">
                <div class="dropdown-selected">Select Role</div>
                <div class="dropdown-options">
                <div data-value="student">Student</div>
                <div data-value="teacher">Teacher</div>
            </div>

            <!-- hidden input for form submission -->
            <input type="hidden" name="role" id="roleInput" required>
        </div>

        <button type="submit" class="btn-register">Register</button>
        <div class="login-link">
            <p>Already have an account? <a href="/login">Login</a></p>
        </div>
    </form>
</div>
</body>



<script>
const dropdown = document.querySelector(".custom-dropdown");
const selected = dropdown.querySelector(".dropdown-selected");
const options = dropdown.querySelector(".dropdown-options");
const hiddenInput = document.getElementById("roleInput");

// toggle dropdown
selected.addEventListener("click", () => {
    options.style.display =
        options.style.display === "block" ? "none" : "block";
});

// select option
options.querySelectorAll("div").forEach(option => {
    option.addEventListener("click", () => {
        selected.textContent = option.textContent;
        hiddenInput.value = option.dataset.value;
        options.style.display = "none";
    });
});

// close when clicking outside
document.addEventListener("click", (e) => {
    if (!dropdown.contains(e.target)) {
        options.style.display = "none";
    }
});
</script>


</html>
